name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 裸机跑一遍:这是最快、最容易被别人复现的那条路径
  test:
    name: 样例回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 装 Graphviz 与中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz fontconfig fonts-noto-cjk

      - name: 装 Python 依赖
        run: pip install -r requirements.txt

      - name: 环境自检
        run: python doctor.py

      # 期望值抄自 README「自测」一节 —— 两处必须同时改,改一处就是文档撒谎
      - name: 样例回归(library 4/4、springboot 1/1、campus 1/1)
        run: |
          fail=0
          sample() {
            plan="$1"; want="$2"
            # 写成 if 条件而不是 `out=$(...)` 再查 $?:Actions 的 run 默认带 bash -e,
            # 裸赋值一失败整步就退出,下面的报错 echo 根本执行不到,等于没输出
            if ! out=$(python build.py "$plan" 2>&1); then
              echo "$out"
              echo "::error file=$plan::$plan 未通过(build.py 非零退出)"
              fail=1; return
            fi
            echo "$out"
            # 光看退出码不够:图和关系被静默丢一条,退出码照样是 0
            if ! printf '%s' "$out" | grep -q "$want 通过"; then
              echo "::error file=$plan::$plan 期望「$want 通过」,实际对不上"
              fail=1
            fi
          }
          python plan.py samples/library/plan.json
          python plan.py samples/springboot/plan.json
          python plan.py samples/campus/plan.json
          sample samples/library/plan.json    4/4
          sample samples/springboot/plan.json 1/1
          sample samples/campus/plan.json     1/1
          exit $fail

  # 容器单独跑:证明「换个机器也能出同样的图」这句话不是空话
  docker:
    name: 镜像构建与容器内回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: chartflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 容器内环境自检
        run: docker run --rm chartflow:ci doctor.py

      - name: 容器内跑样例
        run: |
          docker run --rm chartflow:ci build.py samples/library/plan.json
          docker run --rm chartflow:ci build.py samples/springboot/plan.json
          docker run --rm chartflow:ci build.py samples/campus/plan.json

      # 退出码 0 只说明验收过了;这一步确认文件真的落在了盘上
      - name: 容器内产物落地
        run: |
          docker run --rm --entrypoint bash chartflow:ci -c \
            'python build.py samples/campus/plan.json >/dev/null && ls -la samples/campus/out'
